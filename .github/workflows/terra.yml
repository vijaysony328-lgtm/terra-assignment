
name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terra-assignment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "e0001b1b-259b-40a0-b9bc-855bb91cf1f3" \
            --password "747a49ef-6470-4def-9b57-0013d1286159" \
            --tenant "ce1221be-2dd4-4dbd-be67-4765d692baf9"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "1901e74c-f287-4ad5-a027-7e82572afe7a"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: terra-assignment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "e0001b1b-259b-40a0-b9bc-855bb91cf1f3" \
            --password "747a49ef-6470-4def-9b57-0013d1286159" \
            --tenant "ce1221be-2dd4-4dbd-be67-4765d692baf9"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "1901e74c-f287-4ad5-a027-7e82572afe7a"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
